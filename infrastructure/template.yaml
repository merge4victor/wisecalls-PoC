      Principal: connect.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Ref ConnectInstanceArn

  CasesContextConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CasesContextFunction
      Principal: connect.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Ref ConnectInstanceArn

  MessageProcessorConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MessageProcessorFunction
      Principal: connect.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Ref ConnectInstanceArn

  LocationSessionConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LocationSessionFunction
      Principal: connect.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Ref ConnectInstanceArn

  GetNextOpenSlotConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GetNextOpenSlotFunction
      Principal: connect.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Ref ConnectInstanceArn

  BookCallbackSlotConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BookCallbackSlotFunction
      Principal: connect.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Ref ConnectInstanceArn

  CustomerContextAssociation:
    Type: AWS::Connect::IntegrationAssociation
    Properties:
      InstanceId: !Ref ConnectInstanceArn
      IntegrationType: LAMBDA_FUNCTION
      IntegrationArn: !GetAtt CustomerContextFunction.Arn

  CustomerVerificationAssociation:
    Type: AWS::Connect::IntegrationAssociation
    Properties:
      InstanceId: !Ref ConnectInstanceArn
      IntegrationType: LAMBDA_FUNCTION
      IntegrationArn: !GetAtt CustomerVerificationFunction.Arn

  ProductRatesAssociation:
    Type: AWS::Connect::IntegrationAssociation
    Properties:
      InstanceId: !Ref ConnectInstanceArn
      IntegrationType: LAMBDA_FUNCTION
      IntegrationArn: !GetAtt ProductRatesFunction.Arn

  AtmLocatorAssociation:
    Type: AWS::Connect::IntegrationAssociation
    Properties:
      InstanceId: !Ref ConnectInstanceArn
      IntegrationType: LAMBDA_FUNCTION
      IntegrationArn: !GetAtt AtmLocatorFunction.Arn

  CasesContextAssociation:
    Type: AWS::Connect::IntegrationAssociation
    Properties:
      InstanceId: !Ref ConnectInstanceArn
      IntegrationType: LAMBDA_FUNCTION
      IntegrationArn: !GetAtt CasesContextFunction.Arn

  LocationSessionAssociation:
    Type: AWS::Connect::IntegrationAssociation
    Properties:
      InstanceId: !Ref ConnectInstanceArn
      IntegrationType: LAMBDA_FUNCTION
      IntegrationArn: !GetAtt LocationSessionFunction.Arn

  GetNextOpenSlotAssociation:
    Type: AWS::Connect::IntegrationAssociation
    Properties:
      InstanceId: !Ref ConnectInstanceArn
      IntegrationType: LAMBDA_FUNCTION
      IntegrationArn: !GetAtt GetNextOpenSlotFunction.Arn

  BookCallbackSlotAssociation:
    Type: AWS::Connect::IntegrationAssociation
    Properties:
      InstanceId: !Ref ConnectInstanceArn
      IntegrationType: LAMBDA_FUNCTION
      IntegrationArn: !GetAtt BookCallbackSlotFunction.Arn

  MessageProcessorAssociation:
    Type: AWS::Connect::IntegrationAssociation
    Properties:
      InstanceId: !Ref ConnectInstanceArn
      IntegrationType: MESSAGE_PROCESSOR
      IntegrationArn: !GetAtt MessageProcessorFunction.Arn

  ConnectApprovedOrigin:
    Type: AWS::Connect::ApprovedOrigin
    Condition: HasApprovedWebOrigin
    Properties:
      InstanceId: !Ref ConnectInstanceArn
      Origin: !Ref ApprovedWebOrigin

  KnowledgeAssistant:
    Type: AWS::Wisdom::Assistant
    Condition: CreateKnowledgeResources
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-assistant"
      Description: Approved knowledge for secure customer service
      Type: AGENT
      ServerSideEncryptionConfiguration:
        KmsKeyId: !GetAtt DataKey.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  KnowledgeBase:
    Type: AWS::Wisdom::KnowledgeBase
    Condition: CreateKnowledgeResources
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-approved-content"
      Description: Approved retail product and agent procedure content
      KnowledgeBaseType: CUSTOM
      ServerSideEncryptionConfiguration:
        KmsKeyId: !GetAtt DataKey.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  KnowledgeAssociation:
    Type: AWS::Wisdom::AssistantAssociation
    Condition: CreateKnowledgeResources
    Properties:
      AssistantId: !Ref KnowledgeAssistant
      AssociationType: KNOWLEDGE_BASE
      Association:
        KnowledgeBaseId: !Ref KnowledgeBase

  KnowledgeAssistantConnectAssociation:
    Type: AWS::Connect::IntegrationAssociation
    Condition: CreateKnowledgeResources
    Properties:
      InstanceId: !Ref ConnectInstanceArn
      IntegrationType: WISDOM_ASSISTANT
      IntegrationArn: !GetAtt KnowledgeAssistant.AssistantArn

Outputs:
  CoreDataTableName:
    Value: !Ref CoreDataTable
  LocationSessionTableName:
    Value: !Ref LocationSessionTable
  CurrentLocationTableName:
    Value: !Ref CurrentLocationTable
  ToolAuditTableName:
    Value: !Ref ToolAuditTable
  KnowledgeSourceBucketName:
    Value: !Ref KnowledgeSourceBucket
  CustomerUserPoolId:
    Value: !Ref CustomerUserPool
  CustomerUserPoolClientId:
    Value: !Ref CustomerUserPoolClient
  CognitoManagedLoginDomain:
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  AgentUserPoolId:
    Value: !Ref AgentUserPool
  AgentUserPoolClientId:
    Value: !Ref AgentUserPoolClient
  AgentCognitoManagedLoginDomain:
    Value: !Sub "https://${AgentCognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  AgentOidcIssuer:
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${AgentUserPool}"
  AgentOidcAudience:
    Value: !Ref AgentUserPoolClient
  AgentAuthorizationEndpoint:
    Value: !Sub "https://${AgentCognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize"
  AgentTokenEndpoint:
    Value: !Sub "https://${AgentCognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/token"
  LocationApiUrl:
    Value: !Sub "https://${LocationApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}/location"
  CurrentMobileLocationApiUrl:
    Value: !Sub "https://${LocationApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}/location/current"
  LocationFrontendBucketName:
    Condition: CreateLocationFrontend
    Value: !Ref LocationFrontendBucket
  LocationFrontendDistributionId:
    Condition: CreateLocationFrontend
    Value: !Ref LocationFrontendDistribution
  LocationFrontendUrl:
    Condition: CreateLocationFrontend
    Value: !Sub "https://${LocationFrontendDistribution.DomainName}/"
  LocationFrontendCustomUrl:
    Condition: HasFrontendCustomDomain
    Value: !Sub "https://${FrontendCustomDomainName}/"
  ServicePhoneNumberE164:
    Condition: CreateLocationFrontend
    Value: !Ref ServicePhoneNumberE164
  ServicePhoneNumberDisplay:
    Condition: CreateLocationFrontend
    Value: !Ref ServicePhoneNumberDisplay
  SecondaryServicePhoneNumberE164:
    Condition: CreateLocationFrontend
    Value: !Ref SecondaryServicePhoneNumberE164
  SecondaryServicePhoneNumberDisplay:
    Condition: CreateLocationFrontend
    Value: !Ref SecondaryServicePhoneNumberDisplay
  CustomerContextFunctionArn:
    Value: !GetAtt CustomerContextFunction.Arn
  CustomerVerificationFunctionArn:
    Value: !GetAtt CustomerVerificationFunction.Arn
  OtpSessionTableName:
    Value: !Ref OtpSessionTable
  ProductRatesFunctionArn:
    Value: !GetAtt ProductRatesFunction.Arn
  AtmLocatorFunctionArn:
    Value: !GetAtt AtmLocatorFunction.Arn
  CasesContextFunctionArn:
    Value: !GetAtt CasesContextFunction.Arn
  MessageProcessorFunctionArn:
    Value: !GetAtt MessageProcessorFunction.Arn
  LocationSessionFunctionArn:
    Value: !GetAtt LocationSessionFunction.Arn
  GetNextOpenSlotFunctionArn:
    Value: !GetAtt GetNextOpenSlotFunction.Arn
  BookCallbackSlotFunctionArn:
    Value: !GetAtt BookCallbackSlotFunction.Arn
  CallbackPollerFunctionArn:
    Value: !GetAtt CallbackPollerFunction.Arn
  RecordCallbackOutcomeFunctionArn:
    Value: !GetAtt RecordCallbackOutcomeFunction.Arn
  RedactionDemoTeardownFunctionArn:
    Value: !GetAtt RedactionDemoTeardownFunction.Arn
  RedactionDemoSchedulerRoleArn:
    Value: !GetAtt RedactionDemoTeardownSchedulerRole.Arn
  KnowledgeAssistantId:
    Condition: CreateKnowledgeResources
    Value: !Ref KnowledgeAssistant
  KnowledgeBaseId:
    Condition: CreateKnowledgeResources
    Value: !Ref KnowledgeBase
