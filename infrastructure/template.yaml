AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS-native secure Amazon Connect service foundation for voice, chat, cases, customer data and knowledge.

Parameters:
  ProjectName:
    Type: String
    Default: connect-secure-service
    AllowedPattern: "^[a-z][a-z0-9-]{2,39}$"
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  ConnectInstanceArn:
    Type: String
    Description: ARN of the existing Amazon Connect instance.
    AllowedPattern: "^arn:aws[-a-z0-9]*:connect:[-a-z0-9]*:[0-9]{12}:instance/[-a-zA-Z0-9]*$"
  CasesDomainId:
    Type: String
    Default: ""
    Description: Existing Amazon Connect Cases domain ID. Leave empty until Cases is enabled.
  CustomerProfilesDomainName:
    Type: String
    Default: ""
    Description: Existing Customer Profiles domain name.
  ApprovedWebOrigin:
    Type: String
    Default: ""
    Description: Exact HTTPS origin that hosts the Connect chat widget.
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique lowercase prefix for the Cognito managed-login domain.
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,62}$"
  CognitoCallbackUrls:
    Type: CommaDelimitedList
    Description: HTTPS callback URLs for customer authentication.
  CognitoLogoutUrls:
    Type: CommaDelimitedList
    Description: HTTPS logout URLs for customer authentication.
  AgentCognitoDomainPrefix:
    Type: String
    Description: Globally unique lowercase prefix for the agent Cognito managed-login domain. Must differ from CognitoDomainPrefix.
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,62}$"
  AgentCognitoCallbackUrls:
    Type: CommaDelimitedList
    Description: HTTPS callback URLs for agent-map authentication. Update this after agent-map's own CloudFront distribution exists (see agent-map/docs/deployment.md step 5) — an initial placeholder value is expected on first deploy.
  AgentCognitoLogoutUrls:
    Type: CommaDelimitedList
    Description: HTTPS logout URLs for agent-map authentication. Same bootstrapping note as AgentCognitoCallbackUrls.
  LocationWebBaseUrl:
    Type: String
    Default: ""
    Description: HTTPS URL of the consented GPS capture page.
  LocationSessionTtlHours:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 24
  CurrentLocationTtlMinutes:
    Type: Number
    Default: 15
    MinValue: 1
    MaxValue: 1440
  EnableKnowledgeResources:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  EnableLocationFrontend:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create a private S3 origin and HTTPS CloudFront distribution for the location-sharing page.
  ServicePhoneNumberE164:
    Type: String
    Default: "+61370100002"
    AllowedPattern: "^\\+[1-9][0-9]{7,14}$"
    Description: Public service number used by the mobile tel link, in E.164 format.
  ServicePhoneNumberDisplay:
    Type: String
    Default: "03 7010 0002"
    MinLength: 8
    MaxLength: 32
    Description: Human-readable form of the public service number.
  SecondaryServicePhoneNumberE164:
    Type: String
    Default: "+61255500001"
    AllowedPattern: "^\\+[1-9][0-9]{7,14}$"
    Description: Second public service number used by the mobile tel link, in E.164 format.
  SecondaryServicePhoneNumberDisplay:
    Type: String
    Default: "02 5550 0001"
    MinLength: 8
    MaxLength: 32
    Description: Human-readable form of the second public service number.
  FrontendCustomDomainName:
    Type: String
    Default: ""
    Description: Optional custom domain (e.g. demo.wisecalls.ai) for the location frontend CloudFront distribution. Leave empty to use the default *.cloudfront.net domain.
  FrontendCertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN in us-east-1 covering FrontendCustomDomainName. Required when FrontendCustomDomainName is set.
  BasicQueueArn:
    Type: String
    Default: "arn:aws:connect:ap-southeast-2:111122223333:instance/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee/queue/dcc369d7-d5c2-4ee3-9a52-0d10b0219a60"
  CallbackOutboundFlowId:
    Type: String
    Default: "a2c58810-83c5-42c7-b469-3e8d045190f1"
    Description: "Set after Task 6 creates wisecalls-callback-outbound-v1-dev; empty is valid until then."
  CallbackAllowedPhonePrefixes:
    Type: String
    Default: ""
    Description: "Comma-separated E.164 prefixes permitted to book a scheduled callback. For the demo, set this to the operator's own number (scripts/deploy.ps1 fills it from WISECALLS_OPERATOR_PHONE when left empty); set to '+614' afterwards to allow any Australian mobile. An empty value denies all bookings."
    AllowedPattern: "^$|^\\+\\d{3,15}(,\\s*\\+\\d{3,15})*$"
    ConstraintDescription: "Must be empty, or a comma-separated list of E.164 prefixes each starting with + followed by at least 3 digits. A shorter prefix would match far more numbers than intended."

Conditions:
  HasApprovedWebOrigin: !Not [!Equals [!Ref ApprovedWebOrigin, ""]]
  CreateKnowledgeResources: !Equals [!Ref EnableKnowledgeResources, "true"]
  CreateLocationFrontend: !Equals [!Ref EnableLocationFrontend, "true"]
  HasFrontendCustomDomain: !Not [!Equals [!Ref FrontendCustomDomainName, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 8
    Tracing: Active
    Tags:
      Project: !Ref ProjectName
      Environment: !Ref Environment
      DataClassification: Confidential
    Environment:
      Variables:
        CORE_DATA_TABLE: !Ref CoreDataTable
        LOCATION_SESSION_TABLE: !Ref LocationSessionTable
        CURRENT_LOCATION_TABLE: !Ref CurrentLocationTable
        AUDIT_TABLE: !Ref ToolAuditTable
        OTP_SESSION_TABLE: !Ref OtpSessionTable
        CALLBACK_BOOKING_TABLE: !Ref CallbackBookingTable
        CASES_DOMAIN_ID: !Ref CasesDomainId
        CUSTOMER_PROFILES_DOMAIN_NAME: !Ref CustomerProfilesDomainName

Resources:
  DataKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "${ProjectName}-${Environment} customer and knowledge data"
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowConnectAndQConnectUse
            Effect: Allow
            Principal:
              Service:
                - connect.amazonaws.com
                - wisdom.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey*
              - kms:DescribeKey
              - kms:CreateGrant
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ProjectName}-${Environment}"
      TargetKeyId: !Ref DataKey

  KnowledgeSourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt DataKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: NoncurrentVersionRetention
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 365
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  KnowledgeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KnowledgeSourceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt KnowledgeSourceBucket.Arn
              - !Sub "${KnowledgeSourceBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  CoreDataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt DataKey.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClassification
          Value: Confidential

  LocationSessionTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt DataKey.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClassification
          Value: Restricted

  CurrentLocationTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: customerId
          AttributeType: S
      KeySchema:
        - AttributeName: customerId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt DataKey.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClassification
          Value: Restricted

  ToolAuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: auditId
          AttributeType: S
      KeySchema:
        - AttributeName: auditId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt DataKey.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  OtpSessionTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: contactId
          AttributeType: S
      KeySchema:
        - AttributeName: contactId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt DataKey.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClassification
          Value: Restricted

  CallbackBookingTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotKey
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: dueAt
          AttributeType: N
        - AttributeName: contactId
          AttributeType: S
      KeySchema:
        - AttributeName: slotKey
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: dueAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ContactIdIndex
          KeySchema:
            - AttributeName: contactId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt DataKey.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  CustomerUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${ProjectName}-${Environment}-customers"
      DeletionProtection: ACTIVE
      MfaConfiguration: "ON"
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 1
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      Schema:
        - Name: customer_id
          AttributeDataType: String
          Mutable: false
          Required: false
          StringAttributeConstraints:
            MinLength: "6"
            MaxLength: "128"

  CustomerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CustomerUserPool
      ClientName: !Sub "${ProjectName}-${Environment}-connect-chat"
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: !If
        - CreateLocationFrontend
        - !If
          - HasFrontendCustomDomain
          - - !Sub "https://${LocationFrontendDistribution.DomainName}/"
            - !Sub "https://${FrontendCustomDomainName}/"
          - - !Sub "https://${LocationFrontendDistribution.DomainName}/"
        - !Ref CognitoCallbackUrls
      LogoutURLs: !If
        - CreateLocationFrontend
        - !If
          - HasFrontendCustomDomain
          - - !Sub "https://${LocationFrontendDistribution.DomainName}/"
            - !Sub "https://${FrontendCustomDomainName}/"
          - - !Sub "https://${LocationFrontendDistribution.DomainName}/"
        - !Ref CognitoLogoutUrls
      SupportedIdentityProviders: [COGNITO]
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  CustomerUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref CustomerUserPool

  AgentUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${ProjectName}-${Environment}-agents"
      DeletionProtection: ACTIVE
      MfaConfiguration: "ON"
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 1
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      Schema:
        - Name: connect_user_id
          AttributeDataType: String
          Mutable: false
          Required: false
          StringAttributeConstraints:
            MinLength: "6"
            MaxLength: "256"

  AgentUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref AgentUserPool
      ClientName: !Sub "${ProjectName}-${Environment}-agent-map"
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: !Ref AgentCognitoCallbackUrls
      LogoutURLs: !Ref AgentCognitoLogoutUrls
      SupportedIdentityProviders: [COGNITO]
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  AgentUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref AgentCognitoDomainPrefix
      UserPoolId: !Ref AgentUserPool

  LocationApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - !If
            - CreateLocationFrontend
            - !Sub "https://${LocationFrontendDistribution.DomainName}"
            - !Ref AWS::NoValue
          - !If
            - HasFrontendCustomDomain
            - !Sub "https://${FrontendCustomDomainName}"
            - !Ref AWS::NoValue
          - !If [HasApprovedWebOrigin, !Ref ApprovedWebOrigin, !Ref AWS::NoValue]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [POST, OPTIONS]
        MaxAge: 300
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              audience:
                - !Ref CustomerUserPoolClient
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CustomerUserPool}"

  LocationFrontendBucket:
    Type: AWS::S3::Bucket
    Condition: CreateLocationFrontend
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClassification
          Value: PublicApplicationCode

  LocationFrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: CreateLocationFrontend
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-${Environment}-location-oac"
        Description: Signed CloudFront access to the private location frontend bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  LocationFrontendResponseHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Condition: CreateLocationFrontend
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${ProjectName}-${Environment}-location-security"
        Comment: Security headers for the consented customer location page.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.execute-api.${AWS::Region}.${AWS::URLSuffix} https://*.auth.${AWS::Region}.amazoncognito.com; font-src 'self'; base-uri 'none'; form-action 'self' https://*.auth.${AWS::Region}.amazoncognito.com; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "geolocation=(self), camera=(), microphone=()"
              Override: true

  LocationFrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CreateLocationFrontend
    Properties:
      DistributionConfig:
        Comment: !Sub "${ProjectName}-${Environment} consented customer location frontend"
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: !If
          - HasFrontendCustomDomain
          - [!Ref FrontendCustomDomainName]
          - !Ref AWS::NoValue
        Origins:
          - Id: LocationFrontendS3Origin
            DomainName: !GetAtt LocationFrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref LocationFrontendOriginAccessControl
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: LocationFrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref LocationFrontendResponseHeaders
        ViewerCertificate: !If
          - HasFrontendCustomDomain
          - AcmCertificateArn: !Ref FrontendCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  LocationFrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateLocationFrontend
    Properties:
      Bucket: !Ref LocationFrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${LocationFrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${LocationFrontendDistribution}"

  CustomerContextRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess"
      Policies:
        - PolicyName: ReadCustomerAndAudit
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:GetItem]
                Resource:
                  - !GetAtt CoreDataTable.Arn
                  - !Sub "${CoreDataTable.Arn}/index/*"
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt ToolAuditTable.Arn
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn

  DirectoryLookupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess"
      Policies:
        - PolicyName: ReadDirectory
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:GetItem]
                Resource:
                  - !GetAtt CoreDataTable.Arn
                  - !Sub "${CoreDataTable.Arn}/index/*"
              - Effect: Allow
                Action: [kms:Decrypt, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn

  CasesLookupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess"
      Policies:
        - PolicyName: ReadCases
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cases:SearchCases
                  - cases:SearchRelatedItems
                  - cases:GetCase
                Resource: "*"

  MessageProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess"

  LocationSessionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess"
      Policies:
        - PolicyName: ManageLocationSessions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:GetItem]
                Resource:
                  - !GetAtt LocationSessionTable.Arn
                  - !GetAtt CurrentLocationTable.Arn
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn
              - Effect: Allow
                Action:
                  - geo-places:ReverseGeocode
                  - geo-places:SearchNearby
                Resource: "*"
              - Effect: Allow
                Action: sns:Publish
                Resource: "*"

  CustomerVerificationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess"
      Policies:
        - PolicyName: ManageCustomerVerification
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:GetItem]
                Resource:
                  - !GetAtt CoreDataTable.Arn
                  - !Sub "${CoreDataTable.Arn}/index/*"
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
                Resource: !GetAtt OtpSessionTable.Arn
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: "*"

  GetNextOpenSlotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess"
      Policies:
        - PolicyName: ReadCallbackBookings
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:BatchGetItem
                Resource: !GetAtt CallbackBookingTable.Arn
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn

  BookCallbackSlotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess"
      Policies:
        - PolicyName: WriteCallbackBookings
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt CallbackBookingTable.Arn
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn

  CallbackPollerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess"
      Policies:
        - PolicyName: DriveCallbackOutboundCalls
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:UpdateItem]
                Resource:
                  - !GetAtt CallbackBookingTable.Arn
                  - !Sub "${CallbackBookingTable.Arn}/index/*"
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn
              - Effect: Allow
                Action: connect:StartOutboundVoiceContact
                Resource: !Sub "${ConnectInstanceArn}/contact/*"

  CustomerContextFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-customer-context"
      CodeUri: ../functions/customer-context/
      Handler: index.handler
      Role: !GetAtt CustomerContextRole.Arn

  CustomerVerificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-customer-verification"
      CodeUri: ../functions/customer-verification/
      Handler: index.handler
      Role: !GetAtt CustomerVerificationRole.Arn
      Timeout: 10

  ProductRatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-product-rates"
      CodeUri: ../functions/product-rates/
      Handler: index.handler
      Role: !GetAtt DirectoryLookupRole.Arn

  AtmLocatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-atm-locator"
      CodeUri: ../functions/atm-locator/
      Handler: index.handler
      Role: !GetAtt DirectoryLookupRole.Arn

  CasesContextFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-cases-context"
      CodeUri: ../functions/cases-context/
      Handler: index.handler
      Role: !GetAtt CasesLookupRole.Arn
      Timeout: 8

  MessageProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-message-processor"
      CodeUri: ../functions/message-processor/
      Handler: index.handler
      Role: !GetAtt MessageProcessorRole.Arn
      Timeout: 3

  LocationSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-location-session"
      CodeUri: ../functions/location-session/
      Handler: index.handler
      Role: !GetAtt LocationSessionRole.Arn
      Environment:
        Variables:
          CORE_DATA_TABLE: !Ref CoreDataTable
          LOCATION_SESSION_TABLE: !Ref LocationSessionTable
          CURRENT_LOCATION_TABLE: !Ref CurrentLocationTable
          AUDIT_TABLE: !Ref ToolAuditTable
          CASES_DOMAIN_ID: !Ref CasesDomainId
          CUSTOMER_PROFILES_DOMAIN_NAME: !Ref CustomerProfilesDomainName
          LOCATION_TTL_HOURS: !Ref LocationSessionTtlHours
          CURRENT_LOCATION_TTL_MINUTES: !Ref CurrentLocationTtlMinutes
          LOCATION_WEB_BASE_URL: !If
            - CreateLocationFrontend
            - !Sub "https://${LocationFrontendDistribution.DomainName}/"
            - !Ref LocationWebBaseUrl
      Events:
        SubmitLocation:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocationApi
            Path: /location
            Method: POST
            Auth:
              Authorizer: NONE
        SubmitCurrentMobileLocation:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocationApi
            Path: /location/current
            Method: POST

  GetNextOpenSlotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-get-next-open-slot"
      CodeUri: ../functions/get-next-open-slot/
      Handler: index.handler
      Role: !GetAtt GetNextOpenSlotRole.Arn

  BookCallbackSlotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-book-callback-slot"
      CodeUri: ../functions/book-callback-slot/
      Handler: index.handler
      Role: !GetAtt BookCallbackSlotRole.Arn
      Environment:
        Variables:
          CALLBACK_ALLOWED_PHONE_PREFIXES: !Ref CallbackAllowedPhonePrefixes

  CallbackPollerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-callback-poller"
      CodeUri: ../functions/callback-poller/
      Handler: index.handler
      Role: !GetAtt CallbackPollerRole.Arn
      Timeout: 30
      Environment:
        Variables:
          CONNECT_INSTANCE_ARN: !Ref ConnectInstanceArn
          CALLBACK_QUEUE_ARN: !Ref BasicQueueArn
          CALLBACK_OUTBOUND_FLOW_ID: !Ref CallbackOutboundFlowId

  CallbackPollerSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-callback-poller"
      ScheduleExpression: "rate(5 minutes)"
      State: ENABLED
      Targets:
        - Id: CallbackPollerTarget
          Arn: !GetAtt CallbackPollerFunction.Arn

  CallbackPollerSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CallbackPollerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CallbackPollerSchedule.Arn

  RecordCallbackOutcomeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess"
      Policies:
        - PolicyName: RecordCallbackOutcome
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:UpdateItem]
                Resource:
                  - !GetAtt CallbackBookingTable.Arn
                  - !Sub "${CallbackBookingTable.Arn}/index/*"
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn

  RecordCallbackOutcomeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-record-callback-outcome"
      CodeUri: ../functions/record-callback-outcome/
      Handler: index.handler
      Role: !GetAtt RecordCallbackOutcomeRole.Arn

  RecordCallbackOutcomeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-callback-outcome"
      EventPattern:
        source: ["aws.connect"]
        detail-type: ["Amazon Connect Contact Event"]
        detail:
          eventType: ["DISCONNECTED"]
          channel: ["VOICE"]
          initiationMethod: ["API"]
      State: ENABLED
      Targets:
        - Id: RecordCallbackOutcomeTarget
          Arn: !GetAtt RecordCallbackOutcomeFunction.Arn

  RecordCallbackOutcomeRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RecordCallbackOutcomeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RecordCallbackOutcomeRule.Arn

  RedactionDemoTeardownRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: TeardownRedactionDemo
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [connect:ListInstanceStorageConfigs, connect:DisassociateInstanceStorageConfig]
                Resource: !Ref ConnectInstanceArn
              - Effect: Allow
                Action: kinesis:DeleteStream
                Resource: !Sub "arn:${AWS::Partition}:kinesis:${AWS::Region}:${AWS::AccountId}:stream/${ProjectName}-${Environment}-contact-lens-demo"

  RedactionDemoTeardownFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-redaction-demo-teardown"
      CodeUri: ../functions/redaction-demo-teardown/
      Handler: index.handler
      Role: !GetAtt RedactionDemoTeardownRole.Arn
      Timeout: 15

  RedactionDemoTeardownSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeRedactionDemoTeardown
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RedactionDemoTeardownFunction.Arn

  RedactionDemoTeardownSchedulerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RedactionDemoTeardownFunction
      Principal: scheduler.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${ProjectName}-${Environment}-redaction-demo-teardown"

  CustomerContextConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CustomerContextFunction
      Principal: connect.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Ref ConnectInstanceArn

  CustomerVerificationConnectPermission:
